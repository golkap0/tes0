name: Auto Patch YouTube with anddea latest

on:
  workflow_dispatch: # Hanya dijalankan manual

jobs:
  patch-youtube:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Show release info
        run: |
          echo "Release tag: ${{ github.event.release.tag_name }}"
          echo "Release name: ${{ github.event.release.name }}"
          echo "Prerelease: ${{ github.event.release.prerelease }}"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Download morphe-cli
        run: |
          mkdir -p tools
          # Menggunakan nama repo baru 'morphe-desktop' dan menambahkan '-sL' agar curl mengikuti redirect
          CLI_URL=$(curl -sL https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest | jq -r '.assets[] | select(.name | contains(".jar")) | .browser_download_url' | head -1)
          
          if [ -z "$CLI_URL" ] || [ "$CLI_URL" = "null" ]; then
            echo "Error: Gagal mendapatkan URL download untuk morphe-cli.jar"
            exit 1
          fi
          
          echo "Downloading morphe-cli dari: $CLI_URL"
          wget -O tools/morphe-cli.jar "$CLI_URL"

      # Download patches anddea VERSI STABIL TERBARU (Latest)
      - name: Download anddea Patches (Latest)
        run: |
          mkdir -p patches
          PATCHES_URL=$(curl -s https://api.github.com/repos/anddea/revanced-patches/releases/latest | jq -r '.assets[] | select(.name | endswith(".mpp")) | .browser_download_url' | head -1)
          
          if [ -z "$PATCHES_URL" ] || [ "$PATCHES_URL" = "null" ]; then
            echo "Error: Gagal mendapatkan URL download untuk patches.mpp"
            exit 1
          fi
          
          # Ekstrak dan tampilkan versi patch
          PATCH_VERSION=$(echo "$PATCHES_URL" | grep -o 'v[0-9.]*' | head -1)
          echo "Mengunduh anddea patches versi: $PATCH_VERSION"
          
          wget -O patches/patches.mpp "$PATCHES_URL"
          echo "✓ anddea patches ($PATCH_VERSION) downloaded"

      # Download YouTube APK v20.21.37
      - name: Download YouTube APK v20.21.37
        run: |
          wget -O youtube-20.21.37.apk "https://github.com/golkap0/paa/raw/refs/heads/main/youtube-20.21.37.apk"
          echo "✓ YouTube v20.21.37 downloaded"
          
          # Verifikasi file APK
          if [ -f youtube-20.21.37.apk ]; then
            APK_SIZE=$(stat -c%s youtube-20.21.37.apk)
            echo "✓ APK size: $APK_SIZE bytes"
            
            # Verifikasi APK valid (bukan error page HTML)
            if unzip -t youtube-20.21.37.apk > /dev/null 2>&1; then
              echo "✓ YouTube APK is valid"
            else
              echo "✗ YouTube APK is corrupted or invalid"
              exit 1
            fi
          else
            echo "✗ Failed to download YouTube APK"
            exit 1
          fi

      # Decode Custom Keystore dari GitHub Secrets
      - name: Prepare Custom Key
        run: |
          echo "${{ secrets.MY_KEY_STORE }}" | base64 -d > my-release-key.keystore
          echo "✓ Custom Keystore prepared"

      # Proses Patching dengan Custom Key & Armv7 Only
      - name: Patch YouTube v20.21.37
        run: |
          echo "Starting patching process..."
          echo "Patch version: ${{ env.PATCH_VERSION }}"
          java -jar tools/morphe-cli.jar patch \
            --patches patches/patches.mpp \
            --striplibs armeabi-v7a \
            --continue-on-error \
            --disable "Custom branding" \
            --enable "Theme" \
            -O darkThemeBackgroundColor=@android:color/black \
            --keystore my-release-key.keystore \
            --keystore-password "${{ secrets.MY_KEY_PASS }}" \
            --keystore-entry-alias "fas" \
            --keystore-entry-password "${{ secrets.MY_KEY_PASS }}" \
            youtube-20.21.37.apk \
            --out youtube-20.21.37-patched.apk
          echo "✓ Patching completed"

      # Verify Patched APK
      - name: Verify Patched APK
        run: |
          if [ -f youtube-20.21.37-patched.apk ]; then
            echo "✓ Patched APK created successfully"
            
            # Tampilkan informasi APK
            APK_SIZE=$(stat -c%s youtube-20.21.37-patched.apk)
            echo "✓ Patched APK size: $APK_SIZE bytes"
            
            # Verifikasi integritas APK
            if unzip -t youtube-20.21.37-patched.apk > /dev/null 2>&1; then
              echo "✓ Patched APK is valid and intact"
            else
              echo "✗ Patched APK is corrupted"
              exit 1
            fi
          else
            echo "✗ Patching failed"
            exit 1
          fi

      # Upload ke Artifacts - Berlaku 1 Hari
      - name: Upload Patched APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: youtube-20.21.37-anddea-mpp-signed
          path: youtube-20.21.37-patched.apk
          retention-days: 1

      # Cleanup
      - name: Cleanup
        if: always()
        run: |
          rm -f *.apk
          rm -f *.keystore
          echo "✓ Cleanup completed"
