name: Auto Patch YouTube with anddea Patches

on:
  workflow_dispatch: # Hanya dijalankan manual

jobs:
  patch-youtube:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip zipalign apksigner
          pip install zipfile38
      
      - name: Download morphe-cli
        run: |
          mkdir -p tools
          CLI_URL=$(curl -sL https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest | jq -r '.assets[] | select(.name | contains(".jar")) | .browser_download_url' | head -1)
          
          if [ -z "$CLI_URL" ] || [ "$CLI_URL" = "null" ]; then
            echo "Error: Gagal mendapatkan URL download untuk morphe-cli.jar"
            exit 1
          fi
          
          wget -O tools/morphe-cli.jar "$CLI_URL"

      - name: Download anddea Patches (Latest Stable)
        run: |
          mkdir -p patches
          PATCHES_URL=$(curl -s https://api.github.com/repos/anddea/revanced-patches/releases/latest | jq -r '.assets[] | select(.name | endswith(".mpp")) | .browser_download_url' | head -1)
          
          if [ -z "$PATCHES_URL" ] || [ "$PATCHES_URL" = "null" ]; then
            echo "Error: Gagal mendapatkan URL download untuk patches.mpp"
            exit 1
          fi
          
          wget -O patches/patches.mpp "$PATCHES_URL"
          echo "✓ anddea patches downloaded"

      - name: Download YouTube APK
        run: |
          wget -O youtube-20.21.37.apk "https://github.com/golkap0/paa/raw/refs/heads/main/youtube-20.21.37.apk"
          echo "✓ YouTube v20.21.37 downloaded"
          
          # Basic verification
          if ! unzip -t youtube-20.21.37.apk > /dev/null 2>&1; then
            echo "⚠ APK might be corrupted, will attempt fix"
          fi

      # FIX APK STRUCTURE
      - name: Fix APK Structure
        run: |
          echo "🔧 Fixing APK structure..."
          
          # Method 1: Python rebuild
          python3 << 'EOF'
          import zipfile
          import shutil
          
          source_apk = 'youtube-20.21.37.apk'
          fixed_apk = 'youtube-20.21.37-fixed.apk'
          
          print("Rebuilding APK structure...")
          
          with zipfile.ZipFile(source_apk, 'r') as zin:
              with zipfile.ZipFile(fixed_apk, 'w', zipfile.ZIP_DEFLATED) as zout:
                  for item in zin.infolist():
                      data = zin.read(item.filename)
                      info = zipfile.ZipInfo(item.filename, date_time=item.date_time)
                      info.compress_type = zipfile.ZIP_DEFLATED
                      info.external_attr = item.external_attr
                      zout.writestr(info, data)
          
          shutil.move(fixed_apk, source_apk)
          print("✓ APK structure fixed")
          EOF
          
          # Method 2: Zipalign (backup)
          if ! unzip -t youtube-20.21.37.apk > /dev/null 2>&1; then
            echo "Running zipalign fix..."
            zipalign -f 4 youtube-20.21.37.apk youtube-20.21.37-aligned.apk
            mv youtube-20.21.37-aligned.apk youtube-20.21.37.apk
          fi
          
          # Final verification
          if unzip -t youtube-20.21.37.apk > /dev/null 2>&1; then
            echo "✓ APK is valid and ready for patching"
          else
            echo "✗ APK is still corrupted"
            echo "Falling back to stable version..."
            wget -O youtube-20.05.46.apk "https://raw.githubusercontent.com/golkap0/paa/refs/heads/main/youtube-20.05.46.apk"
            mv youtube-20.05.46.apk youtube-20.21.37.apk
          fi

      - name: Prepare Custom Key
        run: |
          echo "${{ secrets.MY_KEY_STORE }}" | base64 -d > my-release-key.keystore
          echo "✓ Custom Keystore prepared"

      - name: Patch YouTube
        run: |
          echo "Starting patching process..."
          java -jar tools/morphe-cli.jar patch \
            --patches patches/patches.mpp \
            --striplibs armeabi-v7a \
            --continue-on-error \
            --disable "Custom branding" \
            --enable "Theme" \
            -O darkThemeBackgroundColor=@android:color/black \
            --keystore my-release-key.keystore \
            --keystore-password "${{ secrets.MY_KEY_PASS }}" \
            --keystore-entry-alias "fas" \
            --keystore-entry-password "${{ secrets.MY_KEY_PASS }}" \
            youtube-20.21.37.apk \
            --out youtube-20.21.37-patched.apk
          echo "✓ Patching completed"

      - name: Verify Patched APK
        run: |
          if [ -f youtube-20.21.37-patched.apk ]; then
            echo "✓ Patched APK created successfully"
            if unzip -t youtube-20.21.37-patched.apk > /dev/null 2>&1; then
              echo "✓ Patched APK is valid and intact"
            else
              echo "✗ Patched APK is corrupted"
              exit 1
            fi
          else
            echo "✗ Patching failed"
            exit 1
          fi

      - name: Upload Patched APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: youtube-20.21.37-anddea-mpp-signed
          path: youtube-20.21.37-patched.apk
          retention-days: 1

      - name: Cleanup
        if: always()
        run: |
          rm -f *.apk
          rm -f *.keystore
          echo "✓ Cleanup completed"
