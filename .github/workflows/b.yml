name: Auto Patch YouTube v20.21.37 (BKS Keystore)

on:
  workflow_dispatch:

jobs:
  patch-youtube:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install gdown
        run: pip install gdown
      
      - name: Download tools & patches
        run: |
          mkdir -p tools patches
          # Download CLI terbaru
          CLI_URL=$(curl -s https://api.github.com/repos/MorpheApp/morphe-cli/releases/latest | jq -r '.assets[] | select(.name | contains(".jar")) | .browser_download_url' | head -1)
          wget -O tools/morphe-cli.jar "$CLI_URL"
          # Download MPP Pre-release terbaru (indeks [0])
          PATCHES_URL=$(curl -s https://api.github.com/repos/MorpheApp/morphe-patches/releases | jq -r '.[0].assets[] | select(.name | endswith(".mpp")) | .browser_download_url' | head -1)
          wget -O patches/patches.mpp "$PATCHES_URL"

      - name: Download YouTube APK
        run: |
          gdown --id "16FdsZ2vmg3O_3QbSjer9yOxa8q5hZKNW" -O youtube.apk --quiet
          echo "✓ YouTube APK downloaded"
      
      # Step ini mengubah teks Base64 kembali menjadi file .keystore asli kamu
      - name: Prepare Custom Keystore
        run: |
          echo "${{ secrets.MY_KEY_STORE }}" | base64 -d > my-release-key.keystore
          echo "✓ Keystore file restored"
      
      - name: Patch YouTube
        run: |
          java -jar tools/morphe-cli.jar patch \
            --patches patches/patches.mpp \
            --striplibs armeabi-v7a \
            --continue-on-error \
            --d "Custom branding" \
            --keystore my-release-key.keystore \
            --keystore-password "${{ secrets.MY_KEY_PASS }}" \
            --keystore-entry-alias "fas" \
            --keystore-entry-password "${{ secrets.MY_KEY_PASS }}" \
            youtube.apk \
            --out youtube-20.21.37-patched.apk

      - name: Upload Patched APK
        uses: actions/upload-artifact@v4
        with:
          name: youtube-v20.21.37-signed-bks
          path: youtube-20.21.37-patched.apk
          retention-days: 7

      - name: Cleanup
        if: always()
        run: rm -f *.apk *.keystore
