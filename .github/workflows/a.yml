name: Auto Patch YouTube v20.21.37

on:
  schedule:
    # Jalankan setiap minggu Minggu jam 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  patch-youtube:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      # Install gdown dan dependencies lainnya
      - name: Install gdown and dependencies
        run: |
          pip install gdown
          sudo apt-get update
          sudo apt-get install -y apktool
          echo "✓ Dependencies installed"
      
      # Download morphe-cli
      - name: Download morphe-cli
        run: |
          mkdir -p tools
          cd tools
          MORPHE_CLI_URL=$(curl -s https://api.github.com/repos/MorpheApp/morphe-cli/releases/latest | jq -r '.assets[] | select(.name | contains(".jar")) | .browser_download_url' | head -1)
          wget -O morphe-cli.jar "$MORPHE_CLI_URL"
          echo "✓ morphe-cli downloaded"
          ls -lh morphe-cli.jar
      
      # Download patches
      - name: Download Morphe Patches
        run: |
          mkdir -p patches
          cd patches
          PATCHES_URL=$(curl -s https://api.github.com/repos/MorpheApp/morphe-patches/releases/latest | jq -r '.assets[] | select(.name | endswith(".mpp")) | .browser_download_url' | head -1)
          wget -O patches.mpp "$PATCHES_URL"
          echo "✓ Morphe patches downloaded"
          ls -lh patches.mpp
      
      # Download YouTube APK versi 20.21.37 dari Google Drive menggunakan gdown
      - name: Download YouTube APK v20.21.37 from Google Drive
        run: |
          echo "Downloading YouTube v20.21.37 from Google Drive using gdown..."
          
          GDRIVE_ID="16FdsZ2vmg3O_3QbSjer9yOxa8q5hZKNW"
          OUTPUT_FILE="youtube-20.21.37.apk"
          
          # Download menggunakan gdown
          gdown --id ${GDRIVE_ID} -O ${OUTPUT_FILE} --quiet
          
          # Verify download
          if [ ! -f "${OUTPUT_FILE}" ]; then
            echo "✗ Failed to download APK"
            exit 1
          fi
          
          FILE_SIZE=$(stat -c%s "${OUTPUT_FILE}" 2>/dev/null || stat -f%z "${OUTPUT_FILE}" 2>/dev/null)
          echo "Downloaded size: $(numfmt --to=iec $FILE_SIZE 2>/dev/null || echo $FILE_SIZE bytes)"
          
          if [ "$FILE_SIZE" -lt 10000000 ]; then
            echo "✗ Downloaded file too small ($FILE_SIZE bytes)"
            exit 1
          fi
          
          echo "✓ YouTube v20.21.37 downloaded successfully"
          ls -lh "${OUTPUT_FILE}"
      
      # Verify APK is valid
      - name: Verify YouTube APK
        run: |
          echo "Verifying APK integrity..."
          if unzip -t youtube-20.21.37.apk > /dev/null 2>&1; then
            echo "✓ APK is valid and intact"
          else
            echo "✗ APK is corrupted or invalid"
            exit 1
          fi
      
      # List available patches
      - name: List Available Patches
        run: |
          echo "Available patches:"
          java -jar tools/morphe-cli.jar list-patches patches/patches.mpp | head -30
      
      # Patch YouTube dengan default settings + strip libs armv7 only
      - name: Patch YouTube v20.21.37 (armv7 only)
        run: |
          echo "Starting patching process..."
          java -jar tools/morphe-cli.jar patch \
            --patches patches/patches.mpp \
            --striplibs armeabi-v7a \
            --exclusive \
            youtube-20.21.37.apk \
            --out youtube-20.21.37-patched.apk
          
          echo "✓ Patching completed"
      
      # Verify Patched APK
      - name: Verify Patched APK
        run: |
          if [ -f youtube-20.21.37-patched.apk ]; then
            echo "✓ Patched APK created successfully"
            SIZE=$(ls -lh youtube-20.21.37-patched.apk | awk '{print $5}')
            echo "  Output size: $SIZE"
            
            # Verify it's a valid APK
            if unzip -t youtube-20.21.37-patched.apk > /dev/null 2>&1; then
              echo "✓ Patched APK is valid and intact"
            else
              echo "✗ Patched APK is corrupted"
              exit 1
            fi
          else
            echo "✗ Patching failed - APK not created"
            exit 1
          fi
      
      # Rename package name menjadi com.youtube.morphe
      - name: Rename Package to com.youtube.morphe
        run: |
          echo "Renaming package: com.google.android.youtube → com.youtube.morphe"
          
          # Buat directory kerja
          mkdir -p apk_work
          cd apk_work
          
          # Copy APK ke working directory
          cp ../youtube-20.21.37-patched.apk youtube-patched.apk
          
          # Decompile APK
          apktool d youtube-patched.apk -o youtube-src -f
          
          # Rename package di AndroidManifest.xml
          sed -i 's/com\.google\.android\.youtube/com.youtube.morphe/g' youtube-src/AndroidManifest.xml
          
          # Rename package di smali files
          if [ -d "youtube-src/smali" ]; then
            find youtube-src/smali -type f -name "*.smali" -exec sed -i 's/Lcom\/google\/android\/youtube/Lcom\/youtube\/morphe/g' {} \;
          fi
          
          # Rename directories
          if [ -d "youtube-src/smali/com/google/android/youtube" ]; then
            mkdir -p youtube-src/smali/com/youtube/morphe
            mv youtube-src/smali/com/google/android/youtube/* youtube-src/smali/com/youtube/morphe/ 2>/dev/null || true
            rm -rf youtube-src/smali/com/google 2>/dev/null || true
          fi
          
          # Rebuild APK
          apktool b youtube-src -o youtube-renamed.apk
          
          # Copy hasil ke parent directory
          cp youtube-renamed.apk ../youtube-20.21.37-patched-morphe.apk
          
          echo "✓ Package renamed successfully"
          cd ..
          ls -lh youtube-20.21.37-patched-morphe.apk
      
      # Re-sign APK setelah rename
      - name: Sign Renamed APK
        run: |
          echo "Signing renamed APK..."
          
          # Generate keystore jika belum ada
          if [ ! -f morphe.keystore ]; then
            keytool -genkey -v -keystore morphe.keystore \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias morphe -storepass morphe123 -keypass morphe123 \
              -dname "CN=Morphe,O=Morphe,L=Indonesia,ST=ID,C=ID"
          fi
          
          # Sign APK menggunakan jarsigner
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
            -keystore morphe.keystore -storepass morphe123 \
            youtube-20.21.37-patched-morphe.apk morphe
          
          echo "✓ APK signed successfully"
      
      # Verify renamed APK
      - name: Verify Renamed APK
        run: |
          if unzip -t youtube-20.21.37-patched-morphe.apk > /dev/null 2>&1; then
            echo "✓ Renamed APK is valid"
            ls -lh youtube-20.21.37-patched-morphe.apk
          else
            echo "✗ Renamed APK is corrupted"
            exit 1
          fi
      
      # Upload HANYA ke Artifact (NO Release)
      - name: Upload Patched APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: youtube-morphe-patched
          path: youtube-20.21.37-patched-morphe.apk
          retention-days: 30
          if-no-files-found: error
      
      # Summary
      - name: Summary
        if: success()
        run: |
          echo "=========================================="
          echo "✓ Build Completed Successfully!"
          echo "=========================================="
          echo ""
          echo "Package: com.youtube.morphe"
          echo "Version: 20.21.37"
          echo "Output APK: youtube-20.21.37-patched-morphe.apk"
          ls -lh youtube-20.21.37-patched-morphe.apk
          echo ""
          echo "Available in: Artifacts"
      
      # Cleanup
      - name: Cleanup
        if: always()
        run: |
          rm -rf apk_work
          rm -f youtube-20.21.37.apk
          rm -f youtube-20.21.37-patched.apk
          rm -f morphe.keystore
          echo "✓ Cleanup completed"
