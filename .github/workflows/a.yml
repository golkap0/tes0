name: Auto Patch YouTube v20.21.37

on:
  schedule:
    # Jalankan setiap minggu Minggu jam 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  patch-youtube:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      # Download morphe-cli
      - name: Download morphe-cli
        run: |
          mkdir -p tools
          cd tools
          MORPHE_CLI_URL=$(curl -s https://api.github.com/repos/MorpheApp/morphe-cli/releases/latest | jq -r '.assets[] | select(.name | contains(".jar")) | .browser_download_url' | head -1)
          wget -O morphe-cli.jar "$MORPHE_CLI_URL"
          echo "✓ morphe-cli downloaded"
          ls -lh morphe-cli.jar
      
      # Download patches
      - name: Download Morphe Patches
        run: |
          mkdir -p patches
          cd patches
          PATCHES_URL=$(curl -s https://api.github.com/repos/MorpheApp/morphe-patches/releases/latest | jq -r '.assets[] | select(.name | endswith(".mpp")) | .browser_download_url' | head -1)
          wget -O patches.mpp "$PATCHES_URL"
          echo "✓ Morphe patches downloaded"
          ls -lh patches.mpp
      
      # Download YouTube APK versi 20.21.37 menggunakan APKCombo API
      - name: Download YouTube APK v20.21.37
        run: |
          echo "Downloading YouTube v20.21.37..."
          
          # Download dari APKMirror (alternative method)
          # Format URL: https://www.apkmirror.com/apk/google-inc/youtube/
          
          # Gunakan script Python untuk download dari web
          python3 << 'EOF'
          import urllib.request
          import json
          import subprocess
          import os
          
          # Coba download menggunakan curl ke APKCombo API
          try:
              print("Attempting to download YouTube v20.21.37...")
              
              # Method 1: Gunakan curl + APKCombo web search
              cmd = [
                  'curl', '-s',
                  'https://www.apkmirror.com/wp-content/themes/APKMirror/download.php?id=9518005&key=ea6b43f77da5cffee56987b912ee0639dfc5dc59&forcebaseapk=true',
                  '-L', '-o', 'youtube-20.21.37.apk'
              ]
              result = subprocess.run(cmd, capture_output=True, text=True)
              
              if os.path.exists('youtube-20.21.37.apk') and os.path.getsize('youtube-20.21.37.apk') > 1000000:
                  print("✓ Downloaded successfully")
                  size_mb = os.path.getsize('youtube-20.21.37.apk') / 1024 / 1024
                  print(f"  Size: {size_mb:.2f} MB")
              else:
                  print("✗ Download failed or file too small")
                  exit(1)
          except Exception as e:
              print(f"Error: {e}")
              exit(1)
          EOF
      
      # Verify APK
      - name: Verify YouTube APK
        run: |
          if [ -f youtube-20.21.37.apk ]; then
            echo "✓ YouTube v20.21.37 APK found"
            ls -lh youtube-20.21.37.apk
            # Verify it's a valid APK (ZIP file)
            if unzip -t youtube-20.21.37.apk > /dev/null 2>&1; then
              echo "✓ APK is valid"
            else
              echo "✗ APK is not valid"
              exit 1
            fi
          else
            echo "✗ Failed to download YouTube APK"
            exit 1
          fi
      
      # List available patches (optional, untuk info)
      - name: List Available Patches
        run: |
          java -jar tools/morphe-cli.jar list-patches patches/patches.mpp | head -20
      
      # Patch YouTube dengan default settings + strip libs armv7 only
      - name: Patch YouTube v20.21.37 with Default Patches (armv7 only)
        run: |
          java -jar tools/morphe-cli.jar patch \
            --patches patches/patches.mpp \
            --striplibs armeabi-v7a \
            youtube-20.21.37.apk \
            --output youtube-20.21.37-patched.apk
      
      # Verify Patched APK
      - name: Verify Patched APK
        run: |
          if [ -f youtube-20.21.37-patched.apk ]; then
            echo "✓ Patched APK created successfully"
            SIZE=$(ls -lh youtube-20.21.37-patched.apk | awk '{print $5}')
            echo "  Size: $SIZE"
            ls -lh youtube-20.21.37-patched.apk
            
            # Verify it's a valid APK
            if unzip -t youtube-20.21.37-patched.apk > /dev/null 2>&1; then
              echo "✓ Patched APK is valid"
            else
              echo "✗ Patched APK is not valid"
              exit 1
            fi
          else
            echo "✗ Patching failed - APK not created"
            exit 1
          fi
      
      # Upload HANYA ke Artifact (NO Release)
      - name: Upload Patched APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: youtube-20.21.37-patched-armv7
          path: youtube-20.21.37-patched.apk
          retention-days: 30
      
      # Cleanup
      - name: Cleanup
        if: always()
        run: |
          rm -f youtube-20.21.37.apk
          rm -f youtube-20.21.37-patched.apk
          echo "✓ Cleanup completed"
