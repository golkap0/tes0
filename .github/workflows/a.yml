name: Auto Patch YouTube Latest Release

on:
  workflow_dispatch: # Jalankan manual dari tab Actions

jobs:
  patch-youtube:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Wajib untuk membuat GitHub Release
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install Tools
        run: |
          pip install gdown
          sudo apt-get install p7zip-full -y
          echo "✓ Tools installed"
      
      # Ambil Info MPP Latest, Changelog, dan Download .mpp
      - name: Fetch Latest MPP Info & Download
        id: mpp_info
        run: |
          mkdir -p tools patches
          RESPONSE=$(curl -s https://api.github.com/repos/MorpheApp/morphe-patches/releases/latest)
          MPP_TAG=$(echo "$RESPONSE" | jq -r '.tag_name')
          MPP_BODY=$(echo "$RESPONSE" | jq -r '.body')
          PATCHES_URL=$(echo "$RESPONSE" | jq -r '.assets[] | select(.name | endswith(".mpp")) | .browser_download_url' | head -1)
          
          echo "$MPP_BODY" > changelog.txt
          wget -O patches/patches.mpp "$PATCHES_URL"
          
          echo "tag=$MPP_TAG" >> $GITHUB_OUTPUT
          echo "✓ Using Morphe Patches version: $MPP_TAG"
      
      - name: Download morphe-cli
        run: |
          CLI_URL=$(curl -s https://api.github.com/repos/MorpheApp/morphe-cli/releases/latest | jq -r '.assets[] | select(.name | contains(".jar")) | .browser_download_url' | head -1)
          wget -O tools/morphe-cli.jar "$CLI_URL"
          echo "✓ morphe-cli downloaded"
      
      - name: Download YouTube APK
        run: |
          gdown --id "16FdsZ2vmg3O_3QbSjer9yOxa8q5hZKNW" -O youtube-20.21.37.apk --quiet
          echo "✓ YouTube v20.21.37 downloaded"
      
      - name: Prepare Custom Key
        run: |
          echo "${{ secrets.MY_KEY_STORE }}" | base64 -d > my-release-key.keystore
          echo "✓ Custom Keystore prepared"
      
      - name: Patch YouTube
        run: |
          echo "Starting patching process..."
          java -jar tools/morphe-cli.jar patch \
            --patches patches/patches.mpp \
            --striplibs armeabi-v7a \
            --continue-on-error \
            --disable "Custom branding" \
            --keystore my-release-key.keystore \
            --keystore-password "${{ secrets.MY_KEY_PASS }}" \
            --keystore-entry-alias "fas" \
            --keystore-entry-password "${{ secrets.MY_KEY_PASS }}" \
            youtube-20.21.37.apk \
            --out youtube-20.21.37-patched.apk
          echo "✓ Patching completed"
      
      - name: Verify Patched APK
        run: |
          if [ -f youtube-20.21.37-patched.apk ] && unzip -t youtube-20.21.37-patched.apk > /dev/null 2>&1; then
            echo "✓ Patched APK is valid"
          else
            echo "✗ Patching failed or APK corrupted"
            exit 1
          fi

      # Kompresi Ultra agar ukuran file kecil saat didownload
      - name: Ultra Compression (7z)
        run: |
          7z a -tzip -mx=9 -m0=lzma2 youtube-v20.21.37-ultra.zip youtube-20.21.37-patched.apk
          echo "✓ Ultra compression completed"
          ls -lh youtube-v20.21.37-ultra.zip

      # Upload ke GitHub Release dengan Info MPP Latest
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "patch-${{ steps.mpp_info.outputs.tag }}"
          name: "YouTube v20.21.37 (MPP ${{ steps.mpp_info.outputs.tag }})"
          body_path: changelog.txt
          files: |
            youtube-20.21.37-patched.apk
            youtube-v20.21.37-ultra.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        if: always()
        run: |
          rm -f *.apk
          rm -f *.keystore
          rm -f *.zip
          rm -f changelog.txt
          echo "✓ Cleanup completed"
