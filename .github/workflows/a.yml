name: Auto Patch YouTube v20.21.37

on:
  schedule:
    # Jalankan setiap minggu Minggu jam 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  patch-youtube:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      # Download morphe-cli
      - name: Download morphe-cli
        run: |
          mkdir -p tools
          cd tools
          MORPHE_CLI_URL=$(curl -s https://api.github.com/repos/MorpheApp/morphe-cli/releases/latest | jq -r '.assets[] | select(.name | contains(".jar")) | .browser_download_url' | head -1)
          wget -O morphe-cli.jar "$MORPHE_CLI_URL"
          echo "✓ morphe-cli downloaded"
          ls -lh morphe-cli.jar
      
      # Download patches
      - name: Download Morphe Patches
        run: |
          mkdir -p patches
          cd patches
          PATCHES_URL=$(curl -s https://api.github.com/repos/MorpheApp/morphe-patches/releases/latest | jq -r '.assets[] | select(.name | endswith(".mpp")) | .browser_download_url' | head -1)
          wget -O patches.mpp "$PATCHES_URL"
          echo "✓ Morphe patches downloaded"
          ls -lh patches.mpp
      
      # Download YouTube APK versi 20.21.37 dari Google Drive (file besar)
      - name: Download YouTube APK v20.21.37 from Google Drive
        run: |
          echo "Downloading YouTube v20.21.37 from Google Drive..."
          
          GDRIVE_ID="16FdsZ2vmg3O_3QbSjer9yOxa8q5hZKNW"
          OUTPUT_FILE="youtube-20.21.37.apk"
          
          # Method 1: Gunakan curl dengan cookie handling untuk Google Drive
          curl -L \
            -b /tmp/cookies.txt -c /tmp/cookies.txt \
            "https://docs.google.com/uc?export=download&id=${GDRIVE_ID}" \
            -o "${OUTPUT_FILE}" \
            --progress-bar
          
          # Jika download gagal, coba method 2
          if [ ! -f "${OUTPUT_FILE}" ] || [ ! -s "${OUTPUT_FILE}" ]; then
            echo "Method 1 failed, trying method 2..."
            
            # Method 2: Gunakan wget dengan custom headers
            wget --header="Authorization: Bearer" \
              --no-check-certificate \
              --no-verbose \
              --show-progress \
              -O "${OUTPUT_FILE}" \
              "https://docs.google.com/uc?export=download&confirm=9iBg&id=${GDRIVE_ID}"
          fi
          
          # Verify download
          if [ ! -f "${OUTPUT_FILE}" ]; then
            echo "✗ Failed to download APK"
            exit 1
          fi
          
          FILE_SIZE=$(stat -c%s "${OUTPUT_FILE}" 2>/dev/null || stat -f%z "${OUTPUT_FILE}" 2>/dev/null)
          echo "Downloaded size: $FILE_SIZE bytes"
          
          if [ "$FILE_SIZE" -lt 10000000 ]; then
            echo "✗ Downloaded file too small ($FILE_SIZE bytes) - might be error page"
            
            # Debug: cek apa file download
            echo "File type:"
            file "${OUTPUT_FILE}"
            
            exit 1
          fi
          
          echo "✓ YouTube v20.21.37 downloaded"
          ls -lh "${OUTPUT_FILE}"
      
      # Verify APK is valid
      - name: Verify YouTube APK
        run: |
          if unzip -t youtube-20.21.37.apk > /dev/null 2>&1; then
            echo "✓ APK is valid ZIP/APK file"
          else
            echo "✗ APK is corrupted or invalid"
            echo "Checking file header..."
            xxd -l 100 youtube-20.21.37.apk
            exit 1
          fi
      
      # List available patches (optional, untuk info)
      - name: List Available Patches
        run: |
          java -jar tools/morphe-cli.jar list-patches patches/patches.mpp | head -20
      
      # Patch YouTube dengan default settings + strip libs armv7 only
      - name: Patch YouTube v20.21.37 with Default Patches (armv7 only)
        run: |
          java -jar tools/morphe-cli.jar patch \
            --patches patches/patches.mpp \
            --striplibs armeabi-v7a \
            youtube-20.21.37.apk \
            --output youtube-20.21.37-patched.apk
      
      # Verify Patched APK
      - name: Verify Patched APK
        run: |
          if [ -f youtube-20.21.37-patched.apk ]; then
            echo "✓ Patched APK created successfully"
            SIZE=$(ls -lh youtube-20.21.37-patched.apk | awk '{print $5}')
            echo "  Size: $SIZE"
            
            # Verify it's a valid APK
            if unzip -t youtube-20.21.37-patched.apk > /dev/null 2>&1; then
              echo "✓ Patched APK is valid"
            else
              echo "✗ Patched APK is corrupted"
              exit 1
            fi
          else
            echo "✗ Patching failed - APK not created"
            exit 1
          fi
      
      # Upload HANYA ke Artifact (NO Release)
      - name: Upload Patched APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: youtube-20.21.37-patched-armv7
          path: youtube-20.21.37-patched.apk
          retention-days: 30
      
      # Cleanup
      - name: Cleanup
        if: always()
        run: |
          rm -f youtube-20.21.37.apk
          rm -f youtube-20.21.37-patched.apk
          rm -f /tmp/cookies.txt
          echo "✓ Cleanup completed"
