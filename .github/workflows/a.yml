name: Auto Patch YouTube Latest Release

on:
  workflow_dispatch: # Jalankan manual dari tab Actions

jobs:
  patch-youtube:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install Tools
        run: |
          pip install gdown
          sudo apt-get install p7zip-full -y
          echo "✓ Tools installed"
      
      # Download morphe-cli terbaru
      - name: Download morphe-cli
        run: |
          mkdir -p tools
          CLI_URL=$(curl -s https://api.github.com/repos/MorpheApp/morphe-cli/releases/latest | jq -r '.assets[] | select(.name | contains(".jar")) | .browser_download_url' | head -1)
          wget -O tools/morphe-cli.jar "$CLI_URL"
          echo "✓ morphe-cli downloaded"

      # Download patches VERSI STABIL TERBARU (Latest)
      - name: Download Morphe Patches (Latest)
        run: |
          mkdir -p patches
          PATCHES_URL=$(curl -s https://api.github.com/repos/MorpheApp/morphe-patches/releases/latest | jq -r '.assets[] | select(.name | endswith(".mpp")) | .browser_download_url' | head -1)
          wget -O patches/patches.mpp "$PATCHES_URL"
          echo "✓ Morphe patches (Latest) downloaded"
      
      # Download YouTube APK v20.21.37
      - name: Download YouTube APK v20.21.37 from Google Drive
        run: |
          GDRIVE_ID="16FdsZ2vmg3O_3QbSjer9yOxa8q5hZKNW"
          gdown --id ${GDRIVE_ID} -O youtube-20.21.37.apk --quiet
          echo "✓ YouTube v20.21.37 downloaded"
      
      # Decode Custom Keystore dari GitHub Secrets
      - name: Prepare Custom Key
        run: |
          echo "${{ secrets.MY_KEY_STORE }}" | base64 -d > my-release-key.keystore
          echo "✓ Custom Keystore prepared"
      
      # Proses Patching dengan Custom Key & Armv7 Only (Disable Branding)
      - name: Patch YouTube v20.21.37
        run: |
          echo "Starting patching process..."
          java -jar tools/morphe-cli.jar patch \
            --patches patches/patches.mpp \
            --striplibs armeabi-v7a \
            --continue-on-error \
            --disable "Custom branding" \
            --keystore my-release-key.keystore \
            --keystore-password "${{ secrets.MY_KEY_PASS }}" \
            --keystore-entry-alias "fas" \
            --keystore-entry-password "${{ secrets.MY_KEY_PASS }}" \
            youtube-20.21.37.apk \
            --out youtube-20.21.37-patched.apk
          echo "✓ Patching completed"
      
      # Kompresi Ultra agar ukuran file sangat kecil di Artifacts
      # Kompresi Ultra menggunakan Deflate standar (paling kompatibel untuk .zip)
      - name: Ultra Compression (7z)
        run: |
          # mx=9: Kompresi level Ultra
          # m0=deflate: Metode standar ZIP yang paling kompatibel
          7z a -tzip -mx=9 -m0=deflate youtube-v20.21.37-ultra.zip youtube-20.21.37-patched.apk
          echo "✓ Ultra compression completed"
          ls -lh youtube-v20.21.37-ultra.zip

      # Upload ke Actions Artifacts (Bisa download file .apk atau .zip)
      - name: Upload to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: youtube-v20.21.37-patched-files
          path: |
            youtube-v20.21.37-ultra.zip
          retention-days: 7
      
      # Cleanup
      - name: Cleanup
        if: always()
        run: |
          rm -f *.apk
          rm -f *.keystore
          rm -f *.zip
          echo "✓ Cleanup completed"
