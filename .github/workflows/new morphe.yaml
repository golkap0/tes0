name: Build Morphe YouTube Patched

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-youtube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download tools and patches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          mkdir -p tools patches

          api() {
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$1"
          }

          CLI_URL=$(api https://api.github.com/repos/MorpheApp/morphe-cli/releases | jq -r '[.[0].assets[] | select(.name | endswith(".jar"))][0].browser_download_url // empty')
          if [ -z "$CLI_URL" ]; then
            echo "::error::morphe-cli.jar not found"
            exit 1
          fi
          wget -q -O tools/morphe-cli.jar "$CLI_URL"

          PATCHES_URL=$(api https://api.github.com/repos/MorpheApp/morphe-patches/releases | jq -r '[.[0].assets[] | select(.name | endswith(".mpp"))][0].browser_download_url // empty')
          if [ -z "$PATCHES_URL" ]; then
            echo "::error::patches.mpp not found"
            exit 1
          fi
          wget -q -O patches/patches.mpp "$PATCHES_URL"

          echo "Tools ready"

      - name: Download YouTube APK
        run: |
          set -eu
          curl -fL --retry 3 --retry-delay 2 \
            https://github.com/golkap0/paa/raw/refs/heads/main/youtube-20.21.37.apk \
            -o youtube.apk
          test -s youtube.apk
          ls -lh youtube.apk

      - name: Restore keystore
        run: |
          echo "${{ secrets.MY_KEY_STORE }}" | base64 -d > my-release-key.keystore

      - name: Show available patches with options
        run: |
          java -jar tools/morphe-cli.jar list-patches \
            --patches patches/patches.mpp \
            --with-options \
            --with-descriptions \
            | grep -iE "package|branding" || true

      - name: Patch YouTube
        run: |
          java -jar tools/morphe-cli.jar patch \
            --patches patches/patches.mpp \
            --striplibs armeabi-v7a \
            --continue-on-error \
            -d "Custom branding" \
            -e "Change package name" \
            -OpackageName=com.fas.morphe \
            --keystore my-release-key.keystore \
            --keystore-password "${{ secrets.MY_KEY_PASS }}" \
            --keystore-entry-alias "fas" \
            --keystore-entry-password "${{ secrets.MY_KEY_PASS }}" \
            youtube.apk \
            --out youtube-20.21.37-morphe.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Morphe-YouTube-v20.21.37
          path: youtube-20.21.37-morphe.apk
          retention-days: 7

      - name: Cleanup
        if: always()
        run: rm -f *.apk *.keystore apps.json apkmd
