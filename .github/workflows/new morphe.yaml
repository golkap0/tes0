name: Build Morphe YouTube Patched (APKMirror)

on: workflow_dispatch:

jobs:
  patch-youtube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download tools & patches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          mkdir -p tools patches

          api() {
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$1"
          }

          CLI_URL=$(api https://api.github.com/repos/MorpheApp/morphe-cli/releases \
            | jq -r '[.[0].assets[] | select(.name | endswith(".jar"))][0].browser_download_url // empty')
          [ -z "$CLI_URL" ] && { echo "::error::morphe-cli.jar tidak ditemukan"; exit 1; }
          wget -q -O tools/morphe-cli.jar "$CLI_URL"

          PATCHES_URL=$(api https://api.github.com/repos/MorpheApp/morphe-patches/releases \
            | jq -r '[.[0].assets[] | select(.name | endswith(".mpp"))][0].browser_download_url // empty')
          [ -z "$PATCHES_URL" ] && { echo "::error::patches.mpp tidak ditemukan"; exit 1; }
          wget -q -O patches/patches.mpp "$PATCHES_URL"

          echo "✓ tools siap"

      - name: Unduh YouTube APK dari APKMirror
        run: |
          set -eu
          curl -fsSL https://github.com/tanishqmanuja/apkmirror-downloader/releases/latest/download/apkmd -o apkmd
          chmod +x apkmd

          cat << 'EOF' > apps.json
          {
            "options": { "outDir": "." },
            "apps": [{
              "org": "google-inc",
              "repo": "youtube",
              "version": "20.21.37",
              "type": "apk",
              "arch": "universal",
              "outFile": "youtube.apk"
            }]
          }
          EOF

          ./apkmd apps.json

      - name: Prepare Custom Keystore
        run: |
          echo "${{ secrets.MY_KEY_STORE }}" | base64 -d > my-release-key.keystore

      - name: Patch YouTube (custom package, default icon/nama)
        run: |
          java -jar tools/morphe-cli.jar patch \
            --patches patches/patches.mpp \
            --striplibs armeabi-v7a \
            --continue-on-error \
            -e "Custom branding" \
            --options "Change package name=packageName=com.fas.morphe" \
            --keystore my-release-key.keystore \
            --keystore-password "${{ secrets.MY_KEY_PASS }}" \
            --keystore-entry-alias "fas" \
            --keystore-entry-password "${{ secrets.MY_KEY_PASS }}" \
            youtube.apk \
            --out youtube-20.21.37-morphe.apk

      - name: Upload Patched APK
        uses: actions/upload-artifact@v4
        with:
          name: Morphe-YouTube-v20.21.37-com.fas.morphe
          path: youtube-20.21.37-morphe.apk
          retention-days: 7

      - name: Cleanup
        if: always()
        run: rm -f *.apk *.keystore apps.json apkmd
