name: Build BadVPN tun2socks (Android NDK)

on:
  workflow_dispatch: 

jobs:
  build-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Build untuk 32-bit (armeabi-v7a) dan 64-bit (arm64-v8a)
        arch:[armeabi-v7a, arm64-v8a]

    name: Build for Android ${{ matrix.arch }}

    steps:
      - name: Clone BadVPN Repository
        run: git clone https://github.com/ambrop72/badvpn.git

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          # Menggunakan NDK versi 25 (stabil)
          ndk-version: r25c

      - name: Compile BadVPN tun2socks with NDK
        run: |
          cd badvpn
          mkdir build && cd build
          
          # Menggunakan toolchain resmi dari Android NDK
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.arch }} \
            -DANDROID_PLATFORM=android-21 \
            -DBUILD_NOTHING_BY_DEFAULT=1 \
            -DBUILD_TUN2SOCKS=1
            
          make badvpn-tun2socks

      - name: Prepare Output
        run: |
          mkdir -p output
          find badvpn/build -name "badvpn-tun2socks" -exec cp {} output/badvpn-tun2socks-${{ matrix.arch }} \;

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: badvpn-tun2socks-android-${{ matrix.arch }}
          path: output/badvpn-tun2socks-${{ matrix.arch }}
