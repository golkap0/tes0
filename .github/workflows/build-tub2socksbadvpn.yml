name: Build tun2socks (ARMv7 Android)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            wget \
            unzip \
            git

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Clone badvpn source
        run: |
          git clone https://github.com/ambrop72/badvpn.git badvpn
          cd badvpn
          echo "badvpn cloned at commit: $(git rev-parse --short HEAD)"

      - name: Configure CMake toolchain for ARMv7
        run: |
          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64"

          cat > armv7-toolchain.cmake << EOF
          set(CMAKE_SYSTEM_NAME Android)
          set(CMAKE_SYSTEM_VERSION 21)
          set(CMAKE_ANDROID_ARCH_ABI armeabi-v7a)
          set(CMAKE_ANDROID_NDK ${NDK_PATH})
          set(CMAKE_ANDROID_STL_TYPE c++_static)

          set(CMAKE_C_COMPILER   ${TOOLCHAIN}/bin/armv7a-linux-androideabi21-clang)
          set(CMAKE_CXX_COMPILER ${TOOLCHAIN}/bin/armv7a-linux-androideabi21-clang++)
          set(CMAKE_AR           ${TOOLCHAIN}/bin/llvm-ar)
          set(CMAKE_RANLIB       ${TOOLCHAIN}/bin/llvm-ranlib)
          set(CMAKE_STRIP        ${TOOLCHAIN}/bin/llvm-strip)

          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          EOF

      - name: Build tun2socks for ARMv7
        run: |
          mkdir -p badvpn/build-armv7
          cd badvpn/build-armv7

          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=../../armv7-toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_NOTHING_BY_DEFAULT=ON \
            -DBUILD_TUN2SOCKS=ON \
            -G Ninja

          ninja tun2socks

      - name: Strip binary
        run: |
          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
          STRIP="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"

          BINARY="badvpn/build-armv7/tun2socks/badvpn-tun2socks"
          if [ -f "$BINARY" ]; then
            $STRIP "$BINARY"
            echo "Binary stripped successfully"
            file "$BINARY"
            ls -lh "$BINARY"
          else
            echo "Binary not found at expected path, searching..."
            find badvpn/build-armv7 -name "badvpn-tun2socks" -o -name "tun2socks"
            exit 1
          fi

      - name: Prepare artifact
        run: |
          mkdir -p output
          BINARY=$(find badvpn/build-armv7 -name "badvpn-tun2socks" | head -n 1)
          cp "$BINARY" output/tun2socks-armv7
          echo "Build info:" > output/BUILD_INFO.txt
          echo "  Date     : $(date -u)" >> output/BUILD_INFO.txt
          echo "  Arch     : armeabi-v7a (ARMv7)" >> output/BUILD_INFO.txt
          echo "  NDK      : r26d" >> output/BUILD_INFO.txt
          echo "  API Level: 21 (Android 5.0+)" >> output/BUILD_INFO.txt
          echo "  Source   : https://github.com/ambrop72/badvpn" >> output/BUILD_INFO.txt
          cat output/BUILD_INFO.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tun2socks-armv7-android
          path: output/
          retention-days: 30
