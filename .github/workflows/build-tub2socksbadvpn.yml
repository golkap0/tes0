name: Build tun2socks (BadVPN) for armv7

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabi cmake make

      - name: Clone BadVPN
        run: |
          git clone https://github.com/ambrop72/badvpn.git
          cd badvpn

      - name: Build tun2socks
        run: |
          cd badvpn
          mkdir build && cd build
          cmake .. \
            -DCMAKE_C_COMPILER=arm-linux-gnueabi-gcc \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=armv7 \
            -DBUILD_NOTHING_BY_DEFAULT=ON \
            -DBUILD_TUN2SOCKS=ON
          make -j$(nproc)

      - name: Strip & rename
        run: |
          cd badvpn/build
          arm-linux-gnueabi-strip tun2socks/tun2socks
          mv tun2socks/tun2socks libtun2socks.so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tun2socks-armv7
          path: badvpn/build/libtun2socks.so
