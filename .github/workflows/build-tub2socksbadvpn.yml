name: Build badvpn-tun2socks (armv7)

on:
  workflow_dispatch: # Mengizinkan Anda menjalankan build ini secara manual melalui tombol di GitHub

jobs:
  build:
    name: Build tun2socks for Android
    runs-on: ubuntu-latest

    steps:
      # 1. Mengunduh source code dari repository badvpn asli
      - name: Checkout badvpn repository
        uses: actions/checkout@v4
        with:
          repository: ambrop72/badvpn
          ref: master

      # 2. Proses kompilasi menggunakan Android NDK dan CMake
      - name: Build with CMake
        run: |
          mkdir build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_NOTHING_BY_DEFAULT=1 \
            -DBUILD_TUN2SOCKS=1
          make badvpn-tun2socks

      # 3. Menyiapkan hasil build
      - name: Prepare output artifact
        run: |
          mkdir -p output
          # Mencari file executable hasil build
          # File sengaja di-rename menjadi libtun2socks.so agar kompatibel dengan Android (baca catatan di bawah)
          find build -name "badvpn-tun2socks" -type f -exec cp {} output/libtun2socks.so \;

      # 4. Mengunggah hasil build agar bisa Anda download
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tun2socks-armeabi-v7a
          path: output/libtun2socks.so
