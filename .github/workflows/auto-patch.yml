name: Auto Run Patch YouTube v20.21.37 (Release with Changelog)

on:
  schedule:
    # Berjalan otomatis setiap hari pada pukul 17:00 UTC (00:00 WIB)
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Paksa jalankan patching dan rilis meskipun versi sudah ada?'
        required: false
        type: boolean
        default: false

jobs:
  check-update:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      mpp_tag: ${{ steps.check.outputs.mpp_tag }}
      patches_url: ${{ steps.check.outputs.patches_url }}
    steps:
      - name: Check Morphe Release
        id: check
        run: |
          # Dapatkan tag rilis terbaru dari redirect URL GitHub (Tanpa API)
          REDIRECT_URL=$(curl -sL -o /dev/null -w "%{url_effective}" https://github.com/MorpheApp/morphe-patches/releases/latest)
          MPP_TAG=$(basename "$REDIRECT_URL")
          
          if [ -z "$MPP_TAG" ] || [ "$MPP_TAG" = "latest" ] || [ "$MPP_TAG" = "releases" ]; then
            echo "Error: Gagal mendeteksi tag rilis terbaru dari Morphe."
            exit 1
          fi
          
          TARGET_TAG="patch-${MPP_TAG}"
          echo "Tag Morphe terbaru: $MPP_TAG"
          echo "Mengecek keberadaan rilis lokal dengan tag: $TARGET_TAG"
          
          # Cek apakah rilis sudah ada di repositori Anda sendiri (menggunakan token bawaan untuk keamanan)
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${TARGET_TAG}")
          
          # Jika rilis sudah ada (HTTP 200) dan input 'force' tidak bernilai true
          if [ "$HTTP_STATUS" -eq 200 ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "Rilis ${TARGET_TAG} sudah ada di repository Anda. Melewati proses patching."
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "Rilis baru terdeteksi atau dijalankan secara paksa. Memulai proses..."
            
            # Cari path file .mpp dari halaman HTML rilis terbaru (Tanpa API)
            PATCHES_URL_PATH=$(curl -sL https://github.com/MorpheApp/morphe-patches/releases/latest | grep -o '/MorpheApp/morphe-patches/releases/download/[^"]*\.mpp' | head -n 1)
            
            if [ -z "$PATCHES_URL_PATH" ]; then
              echo "Error: Gagal menemukan file .mpp pada halaman rilis Morphe."
              exit 1
            fi
            
            PATCHES_URL="https://github.com${PATCHES_URL_PATH}"
            
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "mpp_tag=${MPP_TAG}" >> $GITHUB_OUTPUT
            echo "patches_url=${PATCHES_URL}" >> $GITHUB_OUTPUT
          fi

  patch-youtube:
    needs: check-update
    # Hanya berjalan jika job 'check-update' mendeteksi ada pembaruan baru atau 'force' bernilai true
    if: needs.check-update.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install gdown
        run: pip install gdown
      
      - name: Download Patches & Fetch Changelog
        run: |
          mkdir -p tools patches
          # Download file MPP dari URL hasil pencarian web sebelumnya
          wget -O patches/patches.mpp "${{ needs.check-update.outputs.patches_url }}"
          
          # Mengambil changelog menggunakan token autentikasi agar aman dari limit
          RESPONSE=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/MorpheApp/morphe-patches/releases/tags/${{ needs.check-update.outputs.mpp_tag }}")
          MPP_BODY=$(echo "$RESPONSE" | jq -r '.body // "Tidak ada deskripsi rilis."')
          
          # Simpan ke file changelog.txt
          echo "$MPP_BODY" > changelog.txt
      
      - name: Download morphe-cli
        run: |
          mkdir -p tools
          # Cari path file .jar langsung dari halaman HTML rilis terbaru (Tanpa API)
          CLI_URL_PATH=$(curl -sL https://github.com/MorpheApp/morphe-cli/releases/latest | grep -o '/MorpheApp/morphe-cli/releases/download/[^"]*\.jar' | head -n 1)
          
          if [ -z "$CLI_URL_PATH" ]; then
            echo "Error: Gagal menemukan file .jar pada rilis terbaru morphe-cli."
            exit 1
          fi
          
          CLI_URL="https://github.com${CLI_URL_PATH}"
          wget -O tools/morphe-cli.jar "$CLI_URL"

      - name: Download YouTube APK
        run: |
          gdown "16FdsZ2vmg3O_3QbSjer9yOxa8q5hZKNW" -O youtube.apk --quiet
      
      - name: Prepare Custom Key
        run: |
          echo "${{ secrets.MY_KEY_STORE }}" | base64 -d > my-release-key.keystore
      
      - name: Patch YouTube
        run: |
          java -jar tools/morphe-cli.jar patch \
            --patches patches/patches.mpp \
            --striplibs armeabi-v7a \
            --continue-on-error \
            --disable "Custom branding" \
            --keystore my-release-key.keystore \
            --keystore-password "${{ secrets.MY_KEY_PASS }}" \
            --keystore-entry-alias "fas" \
            --keystore-entry-password "${{ secrets.MY_KEY_PASS }}" \
            youtube.apk \
            --out youtube-20.21.37-patched.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "patch-${{ needs.check-update.outputs.mpp_tag }}"
          name: "YouTube v20.21.37 (MPP ${{ needs.check-update.outputs.mpp_tag }})"
          body_path: changelog.txt
          files: youtube-20.21.37-patched.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        if: always()
        run: rm -f *.apk *.keystore changelog.txt
