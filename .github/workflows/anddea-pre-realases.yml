name: Auto Patch YouTube with anddea Pre-release Patches

on:
  workflow_dispatch: # Hanya dijalankan manual

jobs:
  patch-youtube:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      # Download morphe-cli terbaru
      - name: Download morphe-cli
        run: |
          mkdir -p tools
          MORPHE_CLI_URL=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/MorpheApp/morphe-cli/releases | jq -r 'if type=="array" then .[0].assets[] | select(.name | endswith(".jar")) | .browser_download_url else empty end' | head -1)
          
          if [ -z "$MORPHE_CLI_URL" ]; then
            echo "✗ Gagal via /releases, mencoba endpoint /latest..."
            MORPHE_CLI_URL=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/MorpheApp/morphe-cli/releases/latest | jq -r '.assets[] | select(.name | endswith(".jar")) | .browser_download_url' | head -1)
          fi
          
          echo "Downloading morphe-cli from: $MORPHE_CLI_URL"
          wget -O tools/morphe-cli.jar "$MORPHE_CLI_URL"
          echo "✓ morphe-cli downloaded"
      
      # Download patches anddea PRE-RELEASE TERBARU
      - name: Download anddea Patches (Pre-release)
        run: |
          mkdir -p patches
          PATCHES_URL=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/anddea/revanced-patches/releases | jq -r 'if type=="array" then ([.[] | select(.prerelease == true)][0] // .[0]).assets[] | select(.name | endswith(".mpp")) | .browser_download_url else empty end' | head -1)
          
          if [ -z "$PATCHES_URL" ]; then
            echo "✗ Gagal mendapatkan Pre-release, mencoba fallback endpoint /latest..."
            PATCHES_URL=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/anddea/revanced-patches/releases/latest | jq -r '.assets[] | select(.name | endswith(".mpp")) | .browser_download_url' | head -1)
          fi
          
          echo "Downloading patches from: $PATCHES_URL"
          wget -O patches/patches.mpp "$PATCHES_URL"
          echo "✓ anddea patches downloaded"
      
      # Download YouTube APK v20.21.37
      - name: Download YouTube APK v20.21.37
        run: |
          wget -O youtube-20.21.37.apk "https://github.com/golkap0/paa/raw/refs/heads/main/youtube-20.21.37.apk"
          echo "✓ YouTube v20.21.37 downloaded"
      
      # Decode Custom Keystore dari GitHub Secrets
      - name: Prepare Custom Key
        run: |
          echo "${{ secrets.MY_KEY_STORE }}" | base64 -d > my-release-key.keystore
          echo "✓ Custom Keystore prepared"
      
      # Proses Patching dengan Custom Key & Armv7 Only
      - name: Patch YouTube v20.21.37
        run: |
          echo "Starting patching process..."
          java -jar tools/morphe-cli.jar patch \
            --patches patches/patches.mpp \
            --striplibs armeabi-v7a \
            --continue-on-error \
            --disable "Custom branding" \
            --enable "Theme" \
            -O darkThemeBackgroundColor=@android:color/black \
            --keystore my-release-key.keystore \
            --keystore-password "${{ secrets.MY_KEY_PASS }}" \
            --keystore-entry-alias "fas" \
            --keystore-entry-password "${{ secrets.MY_KEY_PASS }}" \
            youtube-20.21.37.apk \
            --out youtube-20.21.37-patched.apk
          echo "✓ Patching completed"
      
      # Verify Patched APK
      - name: Verify Patched APK
        run: |
          if [ -f youtube-20.21.37-patched.apk ]; then
            echo "✓ Patched APK created successfully"
            if unzip -t youtube-20.21.37-patched.apk > /dev/null 2>&1; then
              echo "✓ Patched APK is valid and intact"
            else
              echo "✗ Patched APK is corrupted"
              exit 1
            fi
          else
            echo "✗ Patching failed"
            exit 1
          fi
      
      # Upload ke Artifacts - Berlaku 1 Hari
      - name: Upload Patched APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: youtube-20.21.37-anddea-prerelease-signed
          path: youtube-20.21.37-patched.apk
          retention-days: 1
      
      # Cleanup
      - name: Cleanup
        if: always()
        run: |
          rm -f *.apk
          rm -f *.keystore
          echo "✓ Cleanup completed"
