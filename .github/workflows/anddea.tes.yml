name: Auto Patch YouTube with anddea pre-release Patches TEST

on:
  workflow_dispatch:

jobs:
  patch-youtube:
    runs-on: ubuntu-latest

    env:
      APK_VERSION: "20.26.46"
      APK_FILE: "youtube-20.26.46.apk"
      PATCHED_FILE: "youtube-20.26.46-patched.apk"
      MORPHE_VERSION: ""   # optional: set to a fixed release tag if you want pinning
      PATCHES_VERSION: ""  # optional: set to a fixed release tag if you want pinning

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Download Morphe CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools

          CLI_URL="$(curl -fsSL -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest \
            | jq -r '.assets[] | select(.name | contains(".jar")) | .browser_download_url' | head -1)"

          if [ -z "${CLI_URL}" ] || [ "${CLI_URL}" = "null" ]; then
            echo "Error: Could not find morphe-cli.jar download URL"
            exit 1
          fi

          echo "Downloading Morphe CLI from: ${CLI_URL}"
          curl -fsSL --retry 3 --retry-all-errors -o tools/morphe-cli.jar "${CLI_URL}"

          test -s tools/morphe-cli.jar
          file tools/morphe-cli.jar

      - name: Download anddea patches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p patches

          PATCHES_URL="$(curl -fsSL -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/anddea/revanced-patches/releases \
            | jq -r '[.[] | select(.prerelease == true)] | .[0].assets[] | select(.name | endswith(".mpp")) | .browser_download_url' | head -1)"

          if [ -z "${PATCHES_URL}" ] || [ "${PATCHES_URL}" = "null" ]; then
            echo "Pre-release patches not found. Falling back to latest stable."
            PATCHES_URL="$(curl -fsSL -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              https://api.github.com/repos/anddea/revanced-patches/releases/latest \
              | jq -r '.assets[] | select(.name | endswith(".mpp")) | .browser_download_url' | head -1)"
          fi

          if [ -z "${PATCHES_URL}" ] || [ "${PATCHES_URL}" = "null" ]; then
            echo "Error: Could not find patches.mpp download URL"
            exit 1
          fi

          echo "Downloading patches from: ${PATCHES_URL}"
          curl -fsSL --retry 3 --retry-all-errors -o patches/patches.mpp "${PATCHES_URL}"

          test -s patches/patches.mpp
          file patches/patches.mpp

      - name: Download YouTube APK
        shell: bash
        run: |
          set -euo pipefail

          APK_URL="https://github.com/golkap0/paa/raw/refs/heads/main/youtube-${APK_VERSION}.apk"

          echo "Downloading YouTube APK from: ${APK_URL}"
          curl -fsSL --retry 3 --retry-all-errors -o "${APK_FILE}" "${APK_URL}"

          if [ ! -s "${APK_FILE}" ]; then
            echo "Error: Failed to download YouTube APK v${APK_VERSION}"
            exit 1
          fi

          echo "Validating ZIP structure before patching..."
          file "${APK_FILE}"
          unzip -t "${APK_FILE}" >/dev/null

          echo "APK validation passed"

      - name: Prepare Custom Key
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ secrets.MY_KEY_STORE }}" | base64 -d > my-release-key.keystore
          test -s my-release-key.keystore

      - name: Patch YouTube APK
        shell: bash
        run: |
          set -euo pipefail

          echo "Attempting to patch ${APK_FILE}..."
          java -jar tools/morphe-cli.jar patch \
            --patches patches/patches.mpp \
            --striplibs armeabi-v7a \
            --continue-on-error \
            --disable "Custom branding" \
            --enable "Theme" \
            --enable "Spoof Wi-Fi connection" \
            --enable "MaterialYou" \
            --enable "Hide accessibility controls dialog" \
            -O darkThemeBackgroundColor=@android:color/black \
            --keystore my-release-key.keystore \
            --keystore-password "${{ secrets.MY_KEY_PASS }}" \
            --keystore-entry-alias "fas" \
            --keystore-entry-password "${{ secrets.MY_KEY_PASS }}" \
            "${APK_FILE}" \
            --out "${PATCHED_FILE}"

          if [ ! -s "${PATCHED_FILE}" ]; then
            echo "Error: Patched APK was not created"
            exit 1
          fi

          echo "Validating patched APK..."
          unzip -t "${PATCHED_FILE}" >/dev/null

          echo "PATCHED_VERSION=${APK_VERSION}" >> "$GITHUB_ENV"
          echo "PATCHED_FILE=${PATCHED_FILE}" >> "$GITHUB_ENV"

      - name: Verify Patched APK
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "${{ env.PATCHED_FILE }}" ]; then
            echo "✓ Patched APK (${{ env.PATCHED_VERSION }}) created successfully"
          else
            echo "✗ No patched APK created"
            exit 1
          fi

      - name: Upload Patched APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: youtube-${{ env.PATCHED_VERSION }}-anddea-mpp-signed
          path: ${{ env.PATCHED_FILE }}
          retention-days: 1

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -rf tools patches *.apk *.keystore
          echo "✓ Cleanup completed"
