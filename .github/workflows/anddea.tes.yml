name: Auto Patch YouTube with anddea pre-release Patches

on:
  workflow_dispatch: # Hanya dijalankan manual

jobs:
  patch-youtube:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Download morphe-cli (Latest Stable)
        run: |
          set -euo pipefail
          mkdir -p tools
          # Mengambil latest release Morphe CLI
          CLI_URL=$(curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest \
            | jq -r '.assets[] | select(.name | contains(".jar")) | .browser_download_url' | head -1)
          
          if [ -z "$CLI_URL" ] || [ "$CLI_URL" = "null" ]; then
            echo "Error: Gagal mendapatkan URL download untuk morphe-cli.jar"
            exit 1
          fi
          
          echo "Downloading morphe-cli dari: $CLI_URL"
          wget -O tools/morphe-cli.jar "$CLI_URL"

      - name: Download anddea Patches (Pre-release .mpp)
        run: |
          set -euo pipefail
          mkdir -p patches
          # Hapus /latest, panggil /releases, dan filter yang prerelease == true
          PATCHES_URL=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/anddea/revanced-patches/releases \
            | jq -r '[.[] | select(.prerelease == true)] | .[0].assets[] | select(.name | endswith(".mpp")) | .browser_download_url' | head -1)
          
          if [ -z "$PATCHES_URL" ] || [ "$PATCHES_URL" = "null" ]; then
            echo "Error: Gagal mendapatkan URL download untuk pre-release patches.mpp"
            exit 1
          fi
          
          echo "Downloading pre-release patches dari: $PATCHES_URL"
          wget -O patches/patches.mpp "$PATCHES_URL"
          echo "✓ anddea pre-release patches (.mpp) downloaded"

      - name: Download YouTube APK v20.05.46
        run: |
          set -euo pipefail
          wget -O youtube-20.05.46.apk "https://raw.githubusercontent.com/golkap0/paa/refs/heads/main/youtube-20.05.46.apk"
          if [ ! -s youtube-20.05.46.apk ]; then
            echo "Error: Gagal mendownload YouTube APK"
            exit 1
          fi
          echo "✓ YouTube v20.05.46 downloaded"

      - name: Prepare Custom Key
        run: |
          set -euo pipefail
          echo "${{ secrets.MY_KEY_STORE }}" | base64 -d > my-release-key.keystore
          echo "✓ Custom Keystore prepared"

      - name: Patch YouTube v20.05.46
        run: |
          set -euo pipefail
          echo "Starting patching process..."
          java -jar tools/morphe-cli.jar patch \
            --patches patches/patches.mpp \
            --striplibs armeabi-v7a \
            --continue-on-error \
            --disable "Custom branding" \
            --enable "Theme" \
            -O darkThemeBackgroundColor=@android:color/black \
            --keystore my-release-key.keystore \
            --keystore-password "${{ secrets.MY_KEY_PASS }}" \
            --keystore-entry-alias "fas" \
            --keystore-entry-password "${{ secrets.MY_KEY_PASS }}" \
            youtube-20.05.46.apk \
            --out youtube-20.05.46-patched.apk
          echo "✓ Patching completed"

      - name: Verify Patched APK
        run: |
          set -euo pipefail
          if [ -f youtube-20.05.46-patched.apk ]; then
            echo "✓ Patched APK created successfully"
            if unzip -t youtube-20.05.46-patched.apk > /dev/null 2>&1; then
              echo "✓ Patched APK is valid and intact"
            else
              echo "✗ Patched APK is corrupted"
              exit 1
            fi
          else
            echo "✗ Patching failed"
            exit 1
          fi

      - name: Upload Patched APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: youtube-20.05.46-anddea-mpp-signed
          path: youtube-20.05.46-patched.apk
          retention-days: 1

      - name: Cleanup
        if: always()
        run: |
          rm -rf tools/ patches/ *.apk *.keystore
          echo "✓ Cleanup completed"
